# Builds the Android app in the cloud (no local Android SDK needed). Use: GitHub -> Actions -> "Android build" -> Run workflow.
# NOT yet run by the author of this file; first run may need small fixes. Layout expected: the game (index.html, js/, ...) and android/ at the repo root.
name: Android build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Node tests (levels + daily)
        run: |
          node tools/validate-levels.js
          node tools/test-daily.js
      - name: Build debug APK (signed with the debug key; for testing)
        working-directory: android
        run: gradle assembleDebug
      - name: Build release APK + AAB (signed only if the keystore secrets are set)
        working-directory: android
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
          fi
          gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: arrow-flow-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/release/*.aab
